# Pull request validation for Fabric items.
#
# Runs on pull requests into development. Static analysis only:
# no Fabric connection, no Azure resources, no credentials.
#
# Checks are advisory. To make them blocking, set CONTINUE_ON_ERROR to false
# and add this pipeline as a required status check on development.

trigger: none

pr:
  branches:
    include:
      - development

pool:
  vmImage: ubuntu-latest

variables:
  CONTINUE_ON_ERROR: 'true'
  PYTHON_VERSION: '3.11'

jobs:
  - job: Validate
    displayName: Validate Fabric items
    steps:

      - checkout: self
        displayName: Check out the branch
        fetchDepth: 0

      - task: UsePythonVersion@0
        displayName: Set up Python
        inputs:
          versionSpec: $(PYTHON_VERSION)

      - script: |
          python -m pip install --upgrade pip
          pip install ruff
        displayName: Install tooling

      - script: |
          echo "Linting notebook source"
          ruff check . --output-format=concise
        displayName: 'Check: lint (ruff)'
        continueOnError: ${{ variables.CONTINUE_ON_ERROR }}

      - script: |
          python scripts/check_hardcoded_paths.py .
        displayName: 'Check: hardcoded workspace paths'
        continueOnError: ${{ variables.CONTINUE_ON_ERROR }}

      - script: |
          python scripts/check_secrets.py .
        displayName: 'Check: credentials in code'
        continueOnError: ${{ variables.CONTINUE_ON_ERROR }}

      - script: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          bad = []
          files = [p for p in Path('.').rglob('*.json') if '.git' not in p.parts]
          for f in files:
              try:
                  json.loads(f.read_text(encoding='utf-8'))
              except Exception as exc:
                  bad.append((f, exc))

          print(f"Checked {len(files)} JSON file(s)")
          for f, exc in bad:
              print(f"  invalid: {f}: {exc}")
          sys.exit(1 if bad else 0)
          PY
        displayName: 'Check: JSON item definitions'
        continueOnError: ${{ variables.CONTINUE_ON_ERROR }}

      - script: |
          echo "Validation complete. Checks are advisory."
        displayName: Summary
        condition: always()
