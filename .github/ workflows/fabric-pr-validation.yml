name: Fabric PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get changed files
        id: files
        run: |
          git diff --name-only \
            origin/${{ github.base_ref }} \
            HEAD > changed_files.txt

          cat changed_files.txt

      - name: Block changes outside fabric/dev
        run: |
          INVALID=$(grep -Ev '^fabric/dev/|^README.md|^.github/' changed_files.txt || true)

          if [ -n "$INVALID" ]; then
            echo "The following files are not allowed to be modified through a PR:"
            echo "$INVALID"
            exit 1
          fi

      - name: Validate JSON files
        run: |
          while read FILE; do
            if [[ "$FILE" == *.json && -f "$FILE" ]]; then
              echo "Validating $FILE"
              jq empty "$FILE"
            fi
          done < changed_files.txt

      - name: Check for merge conflicts
        run: |
          if grep -R "<<<<<<< HEAD" fabric/; then
            echo "Merge conflict markers detected."
            exit 1
          fi

      - name: Prevent large files
        run: |
          MAX_SIZE=10485760

          while read FILE; do
            if [ -f "$FILE" ]; then
              SIZE=$(stat -c%s "$FILE")

              if [ "$SIZE" -gt "$MAX_SIZE" ]; then
                echo "$FILE exceeds 10 MB."
                exit 1
              fi
            fi
          done < changed_files.txt

      - name: Validate pull request title
        run: |
          TITLE="${{ github.event.pull_request.title }}"

          if [ ${#TITLE} -lt 10 ]; then
            echo "PR title is too short."
            exit 1
          fi

      - name: Validation completed
        run: |
          echo "All checks passed."
